# config.yaml
pdf_path: "assets/documents/book800.pdf"
markdown_path: "assets/documents/book800.md"
chunk_size: 800
chunk_overlap: 150
embedding_model_dense: "BAAI/bge-small-en-v1.5"   # or "sentence-transformers/all-MiniLM-L6-v2"
embedding_model_reranker: "cross-encoder/ms-marco-MiniLM-L-6-v2"  # for reranking
collection_name: "oncology_handbook"
top_k_retrieve: 10          # initial candidates from hybrid search
top_k_rerank: 3             # final candidates after reranking
llm_model: "gpt-3.5-turbo"  # or use local model via Ollama
temperature: 0.0            # deterministic for grounded answers